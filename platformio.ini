[env:bw16_oled]
platform = realtek-ambz
board = rtl8720dn
framework = arduino
upload_port = /dev/ttyUSB0
upload_speed = 921600
monitor_speed = 115200

lib_deps =
    ArduinoJson@^6.21.0
    LittleFS@^2.0.0

build_flags =
    -DARDUINO_RTL8720DN
    -DUSE_SPIFFS
    -std=c++17
    -Wall

src_filter = +<*> -<.git/> -<.pio/>
